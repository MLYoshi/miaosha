server:
  port: 8080

spring:
  application:
    name: seckill

  datasource:
    url: jdbc:mysql://localhost:3306/miaosha?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379
      password: 123456
      timeout: 3000ms

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.example.seckill.domain,com.example.seckill.vo
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
