
services:
  # 1. MySQL：订单落地存储
  mysql:
    image: mysql:8.0
    container_name: seckill-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 2. Redis：库存预扣减与缓存
  redis:
    image: redis:7.0
    container_name: seckill-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass 123456
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 3. RabbitMQ：异步下单削峰（管理台 localhost:15672）
  rabbitmq:
    image: rabbitmq:3-management
    container_name: seckill-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 4. 后端：Spring Boot，经服务名连中间件
  backend:
    build: ./backend
    container_name: seckill-backend
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai # 与种子脚本 +08:00 时间窗对齐
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # 5. 前端：Nginx 托管 Vite 产物，/api 反代 backend
  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_HOST: backend
        BACKEND_PORT: "8080"
    container_name: seckill-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
