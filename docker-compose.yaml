# 数据库：schema 与种子数据见 docs/db-design.md（旧 miaosha.sql 业务模型的人工维护版）
# 新克隆项目若 mysql_data 为空，请按 docs/db-design.md 第 3 节重建表结构，并按第 4 节插入种子数据
# 导入示例：docker exec -i seckill-mysql mysql -uroot -proot < your_schema.sql
services:
  # 1. MySQL：用于最终订单落地和数据持久化
  mysql:
    image: mysql:8.0
    container_name: seckill-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./mysql_data:/var/lib/mysql

  # 2. Redis：用于库存预扣减、分布式锁、热点数据缓存（秒杀核心）
  redis:
    image: redis:7.0
    container_name: seckill-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass 123456

  # 3. RabbitMQ：用于秒杀请求排队、异步下单削峰
  rabbitmq:
    image: rabbitmq:3-management
    container_name: seckill-rabbitmq
    ports:
      - "5672:5672"   # 客户端连接端口
      - "15672:15672" # Web管理界面端口
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
