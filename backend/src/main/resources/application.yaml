server:
  port: 8080
  tomcat:
    threads:
      # 基线压测调优（2026-08-26）：默认 200 线程在 500 RPS 下排队加剧长尾，扩容做二分定位
      max: 500

spring:
  application:
    name: seckill

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/miaosha?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: 123456
      timeout: 3000ms

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: guest
    password: guest
    publisher-confirm-type: simple                     # 可靠发送：发布确认（对应原 acks=all）
    publisher-returns: true
    listener:
      simple:
        concurrency: 3                                    # 3 个并发消费者（对应原 3 分区并行）
        prefetch: 10

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.example.seckill.domain,com.example.seckill.vo
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
