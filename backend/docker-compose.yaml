# 数据库：schema 与种子数据见 docs/db-design.md（旧 miaosha.sql 业务模型的人工维护版）
# 新克隆项目若 mysql_data 为空，直接执行自包含种子脚本（含建表 + 种子数据 + 时间窗修正）：
#   docker exec -i seckill-mysql mysql -uroot -proot --default-character-set=utf8mb4 < sql/fix-seed-time-window.sql
# 详细说明见 sql/README.md
services:
  # 1. MySQL：用于最终订单落地和数据持久化
  mysql:
    image: mysql:8.0
    container_name: seckill-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./mysql_data:/var/lib/mysql

  # 2. Redis：用于库存预扣减、分布式锁、热点数据缓存（秒杀核心）
  redis:
    image: redis:7.0
    container_name: seckill-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass 123456

  # 3. Kafka：用于秒杀请求排队、异步下单削峰（KRaft 单节点，无 ZooKeeper）
  kafka:
    image: apache/kafka:4.3.1
    container_name: seckill-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
