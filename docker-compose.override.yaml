# 本地多项目共存覆盖：
# 1. code2 目录的旧项目占用了 seckill-* 容器名，本文件把当前项目的容器
#    改用 seckill2-* 前缀，避免容器名冲突。
# 2. 宿主机 8080 被本地进程占用，backend 映射到 18080。
# docker compose 会自动合并同目录的 docker-compose.override.yaml；
# 压测脚本通过环境变量注入对应容器名与后端地址（见 seckill-load-test/README.md）。
services:
  mysql:
    container_name: seckill2-mysql
  redis:
    container_name: seckill2-redis
  kafka:
    container_name: seckill2-kafka
  backend:
    container_name: seckill2-backend
    ports: !override
      - "18080:8080"
  frontend:
    container_name: seckill2-frontend
